# Déploiement Cloudflare Workers du front ViewLog.
# - Sert le build Vite (./dist) comme site statique, avec fallback SPA.
# - Un Worker (worker/index.js) expose /api/track (compteur d'analyses anonyme).
name = "viewlog"
compatibility_date = "2025-01-01"
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Le Worker s'exécute avant les assets pour intercepter /api/*.
run_worker_first = true

# Événements d'usage anonymes et agrégés (page_view / import / open / feature).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "viewlog_events"

# Dashboard privé /api/stats. Secrets à définir (jamais dans ce fichier) :
#   wrangler secret put CF_ACCOUNT_ID        # ID du compte Cloudflare
#   wrangler secret put CF_ANALYTICS_TOKEN   # API token avec "Account Analytics: Read"
#   wrangler secret put STATS_TOKEN          # mot de passe d'accès à la page privée

# Rate limiting de /api/stats : 10 requêtes / 60 s par IP (anti brute-force).
[[ratelimit]]
name = "STATS_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

