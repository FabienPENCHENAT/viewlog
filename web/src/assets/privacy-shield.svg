<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Confidentialité">
  <!-- Bouclier (slate) : haut + côté gauche, ouvert en bas-droite -->
  <path d="M12 20.6 C 9.2 19.7 5 17.2 5 12 L 5 6.7 L 12 3.1 L 19 6.7 L 19 10.2"
        stroke="#7a8290" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arc bas-droite (ambre) : referme le bouclier -->
  <path d="M19 11.2 C 19 16.9 15.2 19.6 12.4 20.7"
        stroke="#f5a623" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Coche (ambre) -->
  <path d="M8.7 12.3 L 11.1 14.7 L 15.8 9.5"
        stroke="#f5a623" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
