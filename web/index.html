    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is ViewLog safe for sensitive or production logs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. ViewLog runs 100% in your browser and never uploads your logs to any server. The content of your files is parsed locally on your device, so sensitive and production logs never leave your machine. Nothing is sent over the network or stored server-side."
            }
          },
          {
            "@type": "Question",
            "name": "Does ViewLog support large log files?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. ViewLog handles very large files, tens of megabytes and hundreds of thousands of lines. Parsing covers the first million lines and the interface stays smooth thanks to list virtualization. All processing happens locally in your browser."
            }
          },
          {
            "@type": "Question",
            "name": "What log formats does ViewLog support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ViewLog supports plain text logs (.log, .txt) and CSV (.csv). It automatically detects the timestamp, log level (from TRACE to FATAL) and message, and attaches multi-line stack traces to their entry. Application logs, server logs and syslog-style lines are parsed generically, and inline JSON is pretty-printed."
            }
          },
          {
            "@type": "Question",
            "name": "Is ViewLog free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, ViewLog is completely free. There is no account to create and no server to run, because everything happens in your browser."
            }

            "@type": "Question",
            "name": "How does ViewLog protect my data privacy compared to other online log viewers?",

              "@type": "Answer",

            }
          }

      <main>
        <h1>ViewLog: 100% Client-Side, Privacy-First Log Viewer and Inspector</h1>
        <p>
          ViewLog is an in-browser, privacy-first log viewer and inspector for
          developers, DevOps and engineers. It is a 100% client-side log
          inspector: a zero-server log analysis tool where your .log, .txt and
          .csv files are parsed, searched and visualized entirely in your
          browser. Nothing is ever uploaded to a server, which makes it well
          suited to GDPR and HIPAA sensitive logs. ViewLog is free and requires
          no account.
        </p>
        <h2>Frequently asked questions</h2>
        <h3>Is ViewLog safe for sensitive or production logs?</h3>
        <p>
          Yes. ViewLog runs 100% in your browser and never uploads your logs to
          any server. The content of your files is parsed locally on your
          device, so sensitive and production logs never leave your machine.
        </p>
        <h3>Does ViewLog support large log files?</h3>
        <p>
          Yes. ViewLog handles very large files, tens of megabytes and hundreds
          of thousands of lines, and stays smooth thanks to list virtualization.
          All processing happens locally in your browser.
        </p>
        <h3>What log formats does ViewLog support?</h3>
        <p>
          ViewLog supports plain text logs (.log, .txt) and CSV (.csv), with
          automatic detection of the timestamp, log level (from TRACE to FATAL)
          and message. Application, server and syslog-style lines are parsed
          generically.
        </p>
        <h3>Is ViewLog free to use?</h3>
        <p>
          Yes, ViewLog is completely free, with no account to create and no
          server to run.
        </p>
        <h3>How does ViewLog protect my data privacy compared to other online log viewers?</h3>
        <p>
          Unlike online log viewers that upload your files to a remote server,
          ViewLog is 100% client-side: your log content is never uploaded,
          stored, or transmitted. This zero-server design suits GDPR and HIPAA
          sensitive logs.
        </p>
      </main>
